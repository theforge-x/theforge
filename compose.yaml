services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: theforge
      POSTGRES_USER: theforge
      POSTGRES_PASSWORD: theforge
    ports:
      - "6543:5432"
    volumes:
      - theforge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U theforge -d theforge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  theforge-postgres:
